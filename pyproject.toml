[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cbb-atlas-basquete"
version = "1.0.0"
description = "Basquete BR — Atlas Tático • Scouting, Cadeias de Markov, Four Factors e Eficiência Espacial"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Lucas Regis", email = "lucaaregis4r@gmail.com"}
]
dependencies = [
    "duckdb>=1.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "beautifulsoup4>=4.12.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "httpx>=0.27.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "playwright>=1.40.0"
]

[project.scripts]
cbb = "cbb.cli:main"
